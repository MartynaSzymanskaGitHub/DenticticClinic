<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{profile.title} + ' - ' + #{common.brand}">Moje dane - Radwańska-Dent</title>
    <link rel="icon" type="image/png" th:href="@{/resources/photos/zdj1.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/resources/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="navbar-container">
        <a class="navbar-brand" th:href="@{/home}" th:text="#{common.brand}">Radwańska-Dent</a>
        <div class="navbar-links">
            <a sec:authorize="hasRole('CLIENT')" th:href="@{/appointment/my}" class="btn btn-green" th:text="#{home.nav.myAppointments}">Moje wizyty</a>
            <a sec:authorize="hasRole('CLIENT')" th:href="@{/appointment/book}" class="btn btn-mint" th:text="#{home.nav.bookAppointment}">Umów wizytę</a>
            <a sec:authorize="hasRole('DENTIST')" th:href="@{/dentist/dashboard}" class="btn btn-mint" th:text="#{home.nav.dentistPanel}">Panel lekarza</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn btn-mint" th:text="#{home.nav.adminPanel}">Panel administratora</a>
            <a th:href="@{/home}" class="btn btn-mint" th:text="#{nav.home}">Strona główna</a>

            <form th:action="@{/logout}" method="post" class="inline-form">
                <button type="submit" class="btn btn-blue" th:text="#{label.logout}">Wyloguj</button>
            </form>

            <a th:href="@{/user/profile(lang='pl')}" class="btn btn-blue">PL</a>
            <a th:href="@{/user/profile(lang='en')}" class="btn btn-blue">EN</a>
        </div>
    </div>
</nav>

<div class="main-container">
    <div class="auth-box" style="max-width: 520px;">
        <h2 class="auth-title" th:text="#{profile.title}">Moje dane</h2>
        <p style="text-align: center; color: #3E885B; margin-top: -12px; margin-bottom: 20px; font-size: 14px;" th:text="#{profile.subtitle}">
            Zarządzaj swoimi danymi osobowymi i hasłem
        </p>

        <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form th:action="@{/user/profile}" th:object="${userProfileDto}" method="post">

            <div th:if="${#fields.hasGlobalErrors()}" class="alert-error">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            </div>

            <div class="form-group">
                <label for="firstName" class="form-label" th:text="#{registerForm.firstName}">Imię</label>
                <input type="text" id="firstName" th:field="*{firstName}" class="form-input" required
                       minlength="3" autocomplete="given-name">
                <div class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>

            <div class="form-group">
                <label for="lastName" class="form-label" th:text="#{registerForm.lastName}">Nazwisko</label>
                <input type="text" id="lastName" th:field="*{lastName}" class="form-input" required
                       minlength="2" autocomplete="family-name">
                <div class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label" th:text="#{registerForm.email}">Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-input" required
                       minlength="6" autocomplete="email">
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label for="phone" class="form-label" th:text="#{registerForm.phone}">Telefon</label>
                <input type="tel" id="phone" th:field="*{phone}" class="form-input" required pattern="^(\+48)?[0-9]{9}$"
                       maxlength="12"
                       th:title="#{registerForm.phone.pattern}" autocomplete="tel">
                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <div class="form-group">
                <label for="gender" class="form-label" th:text="#{registerForm.gender}">Płeć</label>
                <select id="gender" th:field="*{gender}" class="form-select" required>
                    <option value="WOMAN" th:text="#{registerForm.gender.WOMAN}">Kobieta</option>
                    <option value="MAN" th:text="#{registerForm.gender.MAN}">Mężczyzna</option>
                    <option value="OTHER" th:text="#{registerForm.gender.OTHER}">Inna</option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
            </div>

            <div class="form-group" th:if="${currentUser != null}">
                <label class="form-label" th:text="#{profile.role}">Twoja rola</label>
                <div>
                    <span class="badge" style="background-color: #3E885B; font-size: 13px; padding: 6px 12px;"
                          th:text="#{${'registerForm.role.' + currentUser.role.name()}}">Rola</span>
                </div>
            </div>

            <div class="form-group">
                <label for="newPassword" class="form-label" th:text="#{profile.newPassword}">Nowe hasło</label>
                <div class="d-flex gap-2">
                    <input type="password" id="newPassword" th:field="*{newPassword}" class="form-input"
                           minlength="10" maxlength="20"
                           th:placeholder="#{profile.newPassword.placeholder}" autocomplete="new-password">
                </div>
                <small style="color: #666; display: block; margin-top: 4px;" th:text="#{profile.newPassword.hint}">Pozostaw puste, jeśli nie chcesz zmieniać hasła (jeśli zmieniasz: 10–20 znaków).</small>
                <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <button type="submit" class="btn btn-green btn-full mt-3" th:text="#{profile.submit}">Zapisz zmiany</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
