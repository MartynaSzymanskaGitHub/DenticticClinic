<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{home.pageTitle}">Radwańska-Dent</title>
    <link rel="icon" type="image/png" th:href="@{/resources/photos/zdj1.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/resources/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="navbar-container">
        <a class="navbar-brand" th:href="@{/home}" th:text="#{common.brand}">Radwańska-Dent</a>

        <div class="navbar-links">
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-green" th:text="#{nav.login}">Logowanie</a>
                <a th:href="@{/user/register}" class="btn btn-mint" th:text="#{nav.register}">Rejestracja</a>
            </div>

            <div sec:authorize="isAuthenticated()" class="navbar-links">
                <a sec:authorize="hasRole('CLIENT')" th:href="@{/appointment/book}" class="btn btn-mint" th:text="#{home.nav.bookAppointment}"></a>
                <a sec:authorize="hasRole('CLIENT')" th:href="@{/appointment/my}" class="btn btn-green" th:text="#{home.nav.myAppointments}"></a>
                <a sec:authorize="hasRole('DENTIST')" th:href="@{/dentist/dashboard}" class="btn btn-mint" th:text="#{home.nav.dentistPanel}"></a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn btn-mint" th:text="#{home.nav.adminPanel}"></a>
                <a th:href="@{/user/profile}" class="btn btn-mint" th:text="#{nav.myProfile}"></a>

                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit" class="btn btn-blue" th:text="#{label.logout}"></button>
                </form>
            </div>

            <a th:href="@{/home(lang='pl')}" class="btn btn-blue">PL</a>
            <a th:href="@{/home(lang='en')}" class="btn btn-blue">EN</a>
        </div>
    </div>
</nav>

<div class="main-container">

    <div class="home-section">
        <div class="home-section-header">
            <h2 class="home-section-title" th:text="#{home.treatments.title}"></h2>
            <p class="home-section-subtitle" th:text="#{home.treatments.subtitle}"></p>
        </div>

        <div class="treatments-grid">
            <div class="treatment-card" th:each="treatment, iterStat : ${treatments}">
                <div>
                    <div class="treatment-content-row">
                        <img class="treatment-thumb"
                             th:src="@{'/resources/photos/zdj' + ((${iterStat.index} % (${photoCount != null and photoCount > 0 ? photoCount : 6})) + 1) + '.png'}"
                             th:alt="${treatment.name}">
                        <div class="treatment-text-col">
                            <h4 class="treatment-name"
                                th:text="${#messages.msgOrNull('treatment.name.' + treatment.id) != null ? #messages.msg('treatment.name.' + treatment.id) : treatment.name}"></h4>
                            <p class="treatment-desc"
                               th:text="${#messages.msgOrNull('treatment.desc.' + treatment.id) != null ? #messages.msg('treatment.desc.' + treatment.id) : treatment.description}"></p>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="treatment-info">
                        <span class="treatment-duration" th:text="#{home.treatments.duration} + ': ' + ${treatment.estimatedMinutes} + ' ' + #{home.treatments.minutes}"></span>
                        <span class="treatment-price" th:text="${treatment.price} + ' ' + #{common.currency}"></span>
                    </div>
                    <a sec:authorize="hasRole('CLIENT')" th:href="@{/appointment/book(treatmentId=${treatment.id})}" class="btn-book-treatment" th:text="#{home.nav.bookAppointment}"></a>
                </div>
            </div>
        </div>
    </div>

    <div class="home-section">
        <div class="home-section-header">
            <h2 class="home-section-title" th:text="#{home.dentists.title}">Nasi specjaliści</h2>
            <p class="home-section-subtitle" th:text="#{home.dentists.subtitle}"></p>
        </div>

        <div class="specialists-slider-box" th:if="${!#lists.isEmpty(dentists)}">
            <div id="specialistsCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item"
                         th:each="dentist, iterStat : ${dentists}"
                         th:classappend="${iterStat.first} ? 'active'">
                        <div class="specialist-card">
                            <h3 class="specialist-name" th:text="#{home.dentists.prefix} + ' ' + ${dentist.firstName} + ' ' + ${dentist.lastName}"></h3>
                            <p class="specialist-role" th:text="#{home.dentists.specialty}"></p>
                            <p class="specialist-contact" th:text="#{home.dentists.email} + ': ' + ${dentist.email}"></p>
                            <p class="specialist-contact" th:text="#{home.dentists.phone} + ': ' + ${dentist.phone}"></p>

                            <div class="specialist-footer">
                                <span class="treatment-duration" th:text="#{home.dentists.availableOnline}"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#specialistsCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden" th:text="#{pagination.previous}">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#specialistsCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden" th:text="#{pagination.next}">Next</span>
                </button>
            </div>
        </div>
    </div>

</div>

<footer class="site-footer">
    <div class="footer-container">
        <div class="footer-col">
            <h4 th:text="#{common.brand}">Radwańska-Dent</h4>
            <p th:text="#{home.footer.subtitle}">Centrum Stomatologii</p>
            <p th:text="#{home.footer.address}">ul. Radwańska 15, 90-541 Łódź | tel. +48 111 222 333</p>
        </div>
        <div class="footer-col">
            <h4 th:text="#{home.footer.hoursTitle}">Godziny otwarcia</h4>
            <p th:text="#{home.footer.hoursWeek}">Poniedziałek: Piątek: 08:00 – 20:00</p>
            <p th:text="#{home.footer.hoursSat}">Sobota: 09:00 – 14:00</p>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
